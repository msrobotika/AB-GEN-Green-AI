# AB-GEN 80% Accuracy — Docker Compose for Production

services:
  abgen:
    build: .
    container_name: abgen_demo
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ABGEN_HOST=0.0.0.0
      - ABGEN_PORT=5000
      - ABGEN_THREADS=4
    # GPU support (optional — requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Optional: nginx reverse proxy for HTTPS
  # nginx:
  #   image: nginx:alpine
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on: [abgen]
